; Bayiinet — PHP ayarları (php-fpm + php-cli için aynı dosya kopyalanır)
;
; Kurulum:
;   sudo cp deploy/oracle/php-fpm-bayiinet.ini /etc/php/8.3/fpm/conf.d/99-bayiinet.ini
;   sudo cp deploy/oracle/php-fpm-bayiinet.ini /etc/php/8.3/cli/conf.d/99-bayiinet.ini
;   sudo systemctl restart php8.3-fpm
;
; Neden gerekli: Trendyol/XML işleri büyük dosyalarla çalışır; varsayılan
; Ubuntu ayarlarında upload 2M, memory 128M, max_execution_time 30 sn'dir ve
; 15.000 ürünlük XML'de "Allowed memory size exhausted" / 504 hataları alınır.

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Kuyruk işçisi ve artisan komutları için de yeterli olmalı
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; OPcache (üretim performansı)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Hata günlüğü: Laravel log'uyla çakışmasın
display_errors = Off
log_errors = On
