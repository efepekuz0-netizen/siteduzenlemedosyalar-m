# Bayiinet — nginx site yapılandırması (Oracle Cloud / Ubuntu)
#
# Kurulum:
#   sudo cp deploy/oracle/nginx-bayiinet.conf /etc/nginx/sites-available/bayiinet
#   sudo sed -i 's|__APP_DIR__|/var/www/bayiinet|g; s|__DOMAIN__|bayiinet.com www.bayiinet.com|g' /etc/nginx/sites-available/bayiinet
#   sudo ln -sf /etc/nginx/sites-available/bayiinet /etc/nginx/sites-enabled/bayiinet
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS kurulumu için (önerilir):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d bayiinet.com -d www.bayiinet.com
#   (certbot bu dosyayı otomatik günceller; sonrasında SESSION_SECURE_COOKIE=true ve APP_URL=https://... yapın)

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Laravel'in public dizini — proje kökü DEĞİL.
    root __APP_DIR__/public;
    index index.php index.html;

    client_max_body_size 256M;   # XML yükleme (Kaynaklar → dosya yükleme)
    charset utf-8;

    access_log /var/log/nginx/bayiinet-access.log;
    error_log  /var/log/nginx/bayiinet-error.log;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # .env, .git ve benzerlerine doğrudan erişimi kapat
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Statik varlıklar
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # storage:link ile gelen yüklemeler (vergi levhası, kargo PDF'i vb.)
    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM'e devir (Ubuntu 22.04/24.04: php8.3-fpm)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Uzun süren sayfalar (XML içe aktarma raporu, teşhis ekranı)
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # health endpoint'i (monitoring / yük dengeleyici)
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss;
}
