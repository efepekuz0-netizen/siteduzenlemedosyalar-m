# Bayiinet — Apache sanal alan (nginx yerine Apache kullanıyorsanız)
#
# Kurulum:
#   sudo apt install apache2 libapache2-mod-php8.3
#   sudo a2enmod rewrite headers deflate expires
#   sudo cp deploy/oracle/apache-bayiinet.conf /etc/apache2/sites-available/bayiinet.conf
#   sudo sed -i 's|__APP_DIR__|/var/www/bayiinet|g; s|__DOMAIN__|bayiinet.com www.bayiinet.com|g' /etc/apache2/sites-available/bayiinet.conf
#   sudo a2ensite bayiinet && sudo a2dissite 000-default
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Bu dosya proje köküne değil, public/ dizinine işaret eder; .htaccess
# dosyasına gerek kalmaz (yönlendirme burada tanımlıdır).

<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __APP_DIR__/public

    <Directory __APP_DIR__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel ön denetleyicisi
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # .env gibi gizli dosyalara erişimi kapat
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/bayiinet-error.log
    CustomLog ${APACHE_LOG_DIR}/bayiinet-access.log combined

    # XML yükleme
    php_value upload_max_filesize 256M
    php_value post_max_size 256M
    php_value memory_limit 512M
    php_value max_execution_time 300
</VirtualHost>
