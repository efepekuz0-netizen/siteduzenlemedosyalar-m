; Bayiinet — supervisord alternatifi (systemd kullanmayanlar için)
;
; Kurulum:
;   sudo apt install supervisor
;   sudo cp deploy/oracle/supervisor-bayiinet.conf /etc/supervisor/conf.d/bayiinet.conf
;   sudo sed -i 's|__APP_DIR__|/var/www/bayiinet|g; s|__USER__|www-data|g; s|__PHP__|/usr/bin/php8.3|g' /etc/supervisor/conf.d/bayiinet.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Not: systemd varken (Ubuntu varsayılanı) deploy/oracle/bayiinet-queue.service
; ve bayiinet-schedule.service dosyalarını kullanın; bu dosya sadece seçenek.

[program:bayiinet-queue]
process_name=%(program_name)s
; __PHP__ = sunucudaki php yolu (ör. /usr/bin/php8.3). Yoksa `command -v php8.3`.
command=__PHP__ __APP_DIR__/artisan queue:work database --queue=marketplace,default,maintenance --sleep=3 --tries=3 --timeout=900 --max-time=3600 --memory=512
directory=__APP_DIR__
autostart=true
autorestart=true
user=__USER__
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue-worker.log
stopwaitsecs=180

[program:bayiinet-maintenance]
process_name=%(program_name)s
; Ağır arka plan işleri: XML içe aktarma (15.000 ürün) ve toplu fiyat güncellemesi.
; Bu program olmasa da bayiinet-queue 'maintenance'ı en son sırada tüketir.
command=__PHP__ __APP_DIR__/artisan queue:work database --queue=maintenance --sleep=3 --tries=1 --timeout=900 --max-time=7200 --memory=768
directory=__APP_DIR__
autostart=true
autorestart=true
user=__USER__
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/maintenance-worker.log
stopwaitsecs=600

[program:bayiinet-schedule]
process_name=%(program_name)s
command=__PHP__ __APP_DIR__/artisan schedule:work
directory=__APP_DIR__
autostart=true
autorestart=true
user=__USER__
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/scheduler.log
